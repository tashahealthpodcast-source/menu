<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔莎健康室 Tasha's Wellness Studio</title>

    <!-- 網站小圖示 (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FAF8F3%22/><path d=%22M50 80A35 35 0 0 1 44 10C72.5 4.5 80 1.5 90 -10c5 10 10 20.9 10 39 0 27.5-23.9 50-50 50z%22 fill=%22%238A9A5B%22 transform=%22rotate(-15 50 50)%22/><path d=%22M5 85c0-15 9-26.8 25-30 11.5-2.3 21 1.5 26 6.5%22 fill=%22none%22 stroke=%22%238A9A5B%22 stroke-width=%224%22 stroke-linecap=%22round%22/></svg>">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="中和南勢角「塔莎健康室」由15年資歷專業護理師主理，結合功能醫學諮詢、血糖管理與深層撥筋、耳穴調理。從根源改善疲勞、睡眠障礙與肩頸痠痛。">
    <meta name="keywords" content="南勢角撥筋, 護理師健康諮詢, 功能醫學諮詢, 血糖管理, 糖尿病衛教, 耳穴調理, 頭顱撥筋, 臉部拉提, 體態管理, PBM光療">
    
    <!-- 引入工具 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #f5f5dc;
            background-image: radial-gradient(#e6e6fa 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d6d3cd; border-radius: 20px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #FAF8F3; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; gap: 15px;
            transition: opacity 0.5s ease-out;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #E7E5E4; border-top: 4px solid #8A9A5B; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div style="color: #8A9A5B; font-weight: bold; letter-spacing: 2px;">Tasha's Wellness</div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const hideLoading = () => {
            const loader = document.getElementById('loading');
            if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }
        };

        const { useState, useEffect } = React;

        // --- Icons ---
        const Leaf = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
        const Clock = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const Calendar = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        const Star = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const Share2 = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>;
        const CheckCircle = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>;
        const Users = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>;
        const Lightbulb = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M15 14c.2-1 .9-1.33 1.33-2-.02.2-.23.6-.5 1"/><path d="M9 18h6"/><path d="M10 20.2V21h4v-.8"/><path d="M10 14h4"/><path d="M14 14v1a1 1 0 0 1-2 0v-1h-2a1 1 0 0 1-1-1V9a5 5 0 0 1 10 0v4a1 1 0 0 1-1 1h-2Z"/></svg>;
        const Zap = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const GlobeIcon = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        const Activity = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
        const Target = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const ChevronDown = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m6 9 6 6 6-6"/></svg>;
        const ChevronUp = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m18 15-6-6-6 6"/></svg>;
        const LineIcon = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M11.96 2A10 10 0 0 0 2 12c0 5.52 4.48 10 10 10a9.92 9.92 0 0 0 5.6-1.74l3.59 1.48c.55.23 1.15-.22 1.15-.8v-4.66A9.92 9.92 0 0 0 22 12c0-5.52-4.48-10-10-10zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/><circle cx="12" cy="11.96" r="4"/></svg>;
        const InstagramIcon = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>;
        const FacebookIcon = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>;

        const TashaWellnessCard = () => {
          const [activeTab, setActiveTab] = useState('home');
          const [expandedFaq, setExpandedFaq] = useState(null);

          useEffect(() => { hideLoading(); }, []);

          const handleFacebookClick = (e) => {
            e.preventDefault();
            window.open("https://www.facebook.com/tashawellness", '_blank', 'noopener,noreferrer');
          };

          const consultationServices = [
            { name: "健檢報告", desc: "協助解讀2-3個健檢報告項目，讓您了解數值背後的意義。", price: "免費" },
            { name: "功能醫學諮詢", time: "30 min", desc: "從功能醫學角度初步評估您的健康狀態與潛在需求。", price: "免費" },
            { name: "生活型態調整", desc: "針對您的作息、壓力、睡眠提供客製化的調整建議。", price: "首次 $899" },
            { name: "備孕 / 產後恢復", desc: "提供備孕期的營養與作息建議，或產後身心修復指導。", price: "首次 $899" },
            { name: "代謝與體態管理", desc: "護理師客製化諮詢，搭配高端儀器與耳穴，並提供個人化飲食討論。", price: "$1,200" }
          ];

          const exclusiveServices = [
            { name: "頭顱減壓耳療", price: "$1,280", desc: "透過專業手法釋放頭部腦壓，搭配耳穴調理，改善睡眠品質與緩解緊繃。" },
            { name: "極致身心舒壓", price: "$2,600", desc: "結合頭部與臉部經絡撥筋，深層釋放腦壓，同時達到提拉亮顏與助眠舒壓的雙重享受。" },
            { name: "美顏拉提護理", price: "$1,800", desc: "臉部經絡撥筋，提拉緊緻，恢復肌膚彈性與光澤。" }
          ];

          const faqs = [
            { q: "Q1. 預約後需要準備什麼？", a: "若是實體調理，建議穿著寬鬆舒適的衣物。若是線上諮詢，請提前準備好您近期的健檢報告或想討論的問題清單。" },
            { q: "Q2. 不確定自己的問題能不能被Tasha解決？", a: "您可以先透過官方 LINE 私訊諮詢。Tasha 會初步評估並給予合適的建議或轉介。" },
            { q: "Q3. 功能醫學能取代一般西醫治療嗎？", a: "不能取代。功能醫學與西醫相輔相成，著重於尋找慢性不適的源頭並調整生活型態。" },
            { q: "Q4. 不確定自己比較適合什麼？", a: "建議先預約基礎諮詢，當天我會根據您的身體狀況客製化最適合的方案。" }
          ];

          const renderContent = () => {
            switch (activeTab) {
              case 'home':
                return (
                  <div className="space-y-6 animate-fadeIn lg:flex lg:flex-row-reverse lg:items-center lg:gap-12 lg:py-8">
                    <header className="text-center space-y-3 py-4 lg:w-1/2">
                      <div className="mx-auto w-32 h-32 md:w-48 md:h-48 rounded-full overflow-hidden border-4 border-white shadow-md mb-4 bg-stone-100">
                          <img src="tasha.jpg" alt="Tasha" className="w-full h-full object-cover"
                               onError={(e) => { e.target.src = 'https://placehold.co/400x400/E7E5E4/8A9A5B?text=Tasha'; }} />
                      </div>
                      <h2 className="text-xl md:text-2xl font-medium text-stone-800 tracking-wide">從內而外，綻放健康光彩</h2>
                      <p className="text-stone-600 text-sm md:text-base leading-relaxed px-4 max-w-md mx-auto">
                        歡迎來到塔莎健康室。<br/>這裡提供一對一的客製化身心調理，讓您在專屬的空間裡找回平靜。
                      </p>
                    </header>
                    
                    <div className="lg:w-1/2 space-y-6">
                      <article className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-stone-100 mx-2">
                          <h3 className="text-sm md:text-base font-semibold text-[#8A9A5B] mb-2 border-b border-dashed pb-1">【Tasha塔莎】介紹</h3>
                          <p className="text-stone-600 text-sm md:text-base leading-relaxed text-justify">
                              我是一位護理師與糖尿病衛教師，對健康推廣有極大熱誠，進修營養保健、中醫養生、耳穴保健，目前是功能醫學診所護理師，想成為每個家庭最信任的健康夥伴。
                          </p>
                      </article>

                      <div className="bg-[#EFECE6] p-5 md:p-8 rounded-2xl mx-1 space-y-4">
                        <div className="flex items-center gap-2 mb-2">
                          <Calendar className="w-5 h-5 text-[#8A9A5B]" />
                          <h3 className="font-medium text-stone-700 md:text-lg">立即預約</h3>
                        </div>
                        <a href="https://cal.com/tasha-wellness/zh" target="_blank" rel="noopener noreferrer" 
                           className="w-full bg-[#8A9A5B] text-white py-3 rounded-lg font-medium text-sm md:text-base flex items-center justify-center gap-2 hover:bg-[#76844d] transition-colors shadow-md">
                          <Calendar className="w-4 h-4" />【預約連結】
                        </a>
                        <a href="https://lin.ee/zG7bpbM" target="_blank" rel="noopener noreferrer"
                           className="w-full bg-[#00B900] text-white py-3 rounded-lg font-medium text-sm md:text-base flex items-center justify-center gap-2 hover:bg-[#009900] transition-colors shadow-md">
                          <LineIcon className="w-4 h-4" />官方LINE (有疑問請私訊)
                        </a>
                        <div className="flex gap-3">
                            <a href="https://www.instagram.com/tasha_wellness" target="_blank" rel="noopener noreferrer"
                               className="flex-1 bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white py-3 rounded-lg font-medium text-sm md:text-base flex items-center justify-center gap-2 hover:opacity-90 shadow-md">
                              <InstagramIcon className="w-4 h-4" />Instagram
                            </a>
                            <a href="https://www.facebook.com/tashawellness" onClick={handleFacebookClick} target="_blank" rel="noopener noreferrer"
                               className="flex-1 bg-[#1877F2] text-white py-3 rounded-lg font-medium text-sm flex items-center justify-center gap-2 hover:bg-[#166fe5] shadow-md">
                              <FacebookIcon className="w-4 h-4 fill-white" />Facebook
                            </a>
                        </div>
                        <a href="https://www.tasha-health.com/" target="_blank" rel="noopener noreferrer"
                           className="w-full bg-stone-600 text-white py-3 rounded-lg font-medium text-sm md:text-base flex items-center justify-center gap-2 hover:bg-stone-700 transition-colors shadow-md">
                          <GlobeIcon className="w-4 h-4" />官方網站
                        </a>
                      </div>
                    </div>
                  </div>
                );

              case 'services':
                return (
                  <div className="space-y-10 animate-fadeIn px-1 pb-10">
                    <section>
                        <h3 className="text-center text-[#657342] mb-6 text-lg font-bold tracking-widest flex items-center justify-center gap-2">
                            <Activity className="w-6 h-6" /> 健康諮詢
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {consultationServices.map((item, i) => (
                            <article key={i} className="bg-white p-5 rounded-xl shadow-sm border border-stone-100 hover:border-[#8A9A5B]/30 transition-all flex flex-col">
                                <div className="flex justify-between items-start mb-2">
                                    <h4 className="font-medium text-stone-800 text-lg">{item.name}</h4>
                                    <span className="text-[#8A9A5B] font-bold ml-2">{item.price}</span>
                                </div>
                                {item.time && <div className="flex items-center gap-2 text-xs text-stone-400 mb-2"><Clock className="w-3 h-3" /><span>{item.time}</span></div>}
                                <p className="text-stone-600 text-sm leading-relaxed">{item.desc}</p>
                            </article>
                            ))}
                        </div>
                    </section>

                    <div className="flex items-center justify-center"><Leaf className="w-6 h-6 text-stone-300" /></div>

                    <section>
                        <h3 className="text-center text-[#B59678] mb-6 text-lg font-bold tracking-widest flex items-center justify-center gap-2">
                            <Star className="w-6 h-6" /> 獨家限量技術
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {exclusiveServices.map((item, i) => (
                            <article key={i} className="bg-[#FAF8F3] p-5 rounded-xl shadow-sm border border-[#E6D0B3] hover:border-[#B59678]/50 transition-all flex flex-col">
                                <div className="flex justify-between items-start mb-2">
                                    <h4 className="font-medium text-stone-800 text-lg">{item.name}</h4>
                                    <span className="text-[#8A9A5B] font-bold ml-2">{item.price}</span>
                                </div>
                                <p className="text-stone-600 text-sm leading-relaxed">{item.desc}</p>
                            </article>
                            ))}
                        </div>
                    </section>

                    {/* 顧客心得 - 電腦版改為多列或保持滑動 */}
                    <div className="mt-8 pt-10 border-t border-stone-200">
                        <h3 className="text-center text-stone-600 mb-6 text-sm font-medium tracking-widest uppercase">顧客心得</h3>
                        <div className="flex overflow-x-auto gap-6 pb-6 px-2 snap-x hide-scrollbar">
                            {[1, 2, 3].map((num) => (
                                <div key={num} className="snap-center shrink-0 w-[85%] md:w-[45%] lg:w-[30%] rounded-xl overflow-hidden shadow-md border border-stone-100 bg-white">
                                    <img src={`review_0${num}.jpeg?v=3`} alt={`心得 ${num}`} className="w-full h-auto"
                                         onError={(e) => { e.target.src = `https://placehold.co/400x600/FAF8F3/8A9A5B?text=review_0${num}.jpeg`; }} />
                                </div>
                            ))}
                        </div>
                        <p className="text-center text-xs text-stone-400">左右滑動查看更多好評</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pt-10 border-t border-stone-200">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-100 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1.5 h-full bg-red-400"></div>
                            <h4 className="font-medium text-stone-800 mb-3 flex items-center gap-2 text-lg"><Activity className="w-5 h-5 text-red-400" /> 為什麼需要控制血糖？</h4>
                            <p className="text-stone-600 text-sm leading-relaxed">血糖不穩定不僅是糖尿病的專利，疲勞、腦霧、睡眠障礙、體重難控制都與之相關。長期波動會引起慢性發炎，維持平穩血糖是健康體態的基石。</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-100 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1.5 h-full bg-[#8A9A5B]"></div>
                            <h4 className="font-medium text-stone-800 mb-3 flex items-center gap-2 text-lg"><Target className="w-5 h-5 text-[#8A9A5B]" /> 功能醫學是什麼？</h4>
                            <p className="text-stone-600 text-sm leading-relaxed">功能醫學致力於找出疾病根源。我們將人體視為完整系統，透過評估營養、腸道、荷爾蒙等，從源頭調整生活型態，達到真正的預防醫學。</p>
                        </div>
                        <div className="bg-[#FAF0E6] p-6 rounded-xl shadow-sm border border-[#E6D0B3] relative overflow-hidden md:col-span-2 lg:col-span-1">
                            <div className="absolute top-0 left-0 w-1.5 h-full bg-[#C5A065]"></div>
                            <h4 className="font-medium text-[#B59678] mb-3 flex items-center gap-2 text-lg"><Lightbulb className="w-5 h-5 fill-current" /> Tasha諮詢的價值</h4>
                            <p className="text-stone-700 text-sm leading-relaxed font-medium">你可能覺得 AI 查資料很方便，但 AI 沒有實務經驗。我花了 15 年累積臨床經驗並持續學習，我的熱忱是主動追蹤您的情形，幫助您真正變健康！</p>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 mt-10">
                        <div className="flex-1">
                            <h3 className="text-stone-600 mb-4 text-sm font-medium tracking-widest uppercase">耳穴與撥筋技術</h3>
                            <div className="space-y-4">
                                <div className="bg-white p-5 rounded-xl border border-stone-100 shadow-sm">
                                    <h4 className="font-medium text-[#8A9A5B] mb-2">撥筋調理</h4>
                                    <p className="text-stone-600 text-sm leading-relaxed">源自中醫的深層調理，深入筋膜層撥開沾黏氣結。頭部撥筋助眠釋壓，臉部撥筋由內而外拉提紅潤。</p>
                                    <div className="mt-4 rounded-lg overflow-hidden"><img src="./1234.jpg" className="w-full h-48 object-cover" onError={(e)=>e.target.src='https://placehold.co/600x400?text=1234.jpg'} /></div>
                                </div>
                            </div>
                        </div>
                        <div className="flex-1">
                            <h3 className="text-stone-600 mb-4 text-sm font-medium tracking-widest uppercase lg:mt-0 mt-6">&nbsp;</h3>
                            <div className="bg-white p-5 rounded-xl border border-stone-100 shadow-sm h-full">
                                <h4 className="font-medium text-[#8A9A5B] mb-2">PBM 光生物調節</h4>
                                <p className="text-stone-600 text-sm leading-relaxed">利用特定波長光線促進細胞能量（ATP）產生。幫助新陳代謝、體態管理並舒緩肌肉緊繃環境。</p>
                                <div className="mt-4 rounded-lg overflow-hidden"><img src="./4321.jpg" className="w-full h-48 object-cover" onError={(e)=>e.target.src='https://placehold.co/600x400?text=4321.jpg'} /></div>
                            </div>
                        </div>
                    </div>
                  </div>
                );

              case 'booking':
                return (
                  <div className="space-y-6 animate-fadeIn max-w-2xl mx-auto">
                    <div className="bg-white p-6 md:p-10 rounded-xl shadow-sm space-y-6">
                      <div className="flex items-start gap-4">
                        <Calendar className="w-6 h-6 text-stone-400 mt-1" />
                        <div><h4 className="font-bold text-stone-800 text-lg">預約方式</h4><p className="text-stone-600 mt-1">以網址預約為主，有疑問請從 IG 或官方 LINE 私訊。</p></div>
                      </div>
                      <div className="flex items-start gap-4"><Clock className="w-6 h-6 text-stone-400 mt-1" />
                        <div><h4 className="font-bold text-stone-800 text-lg">營業時間</h4><p className="text-stone-600 mt-1">以預約網址顯示為主</p></div>
                      </div>
                    </div>
                    <div className="bg-white p-6 md:p-10 rounded-xl shadow-sm border border-stone-100">
                      <h3 className="font-bold text-stone-800 mb-4 text-lg">注意事項</h3>
                      <ul className="space-y-3 text-stone-700 list-disc list-inside marker:text-[#B59678]">
                          <li>請提前5分鐘上線/抵達，遲到可能會影響預約時間。</li>
                          <li>若有同伴請先告知。</li>
                          <li>實體服務請穿著寬鬆舒適的衣物。</li>
                          <li>懷孕、備孕中、重大疾病史請先告知。</li>
                          <li>做臉部撥筋請素顏。</li>
                      </ul>
                    </div>
                  </div>
                );

              case 'faq':
                return (
                  <div className="space-y-4 animate-fadeIn max-w-2xl mx-auto">
                    {faqs.map((faq, i) => (
                      <div key={i} className="bg-white rounded-xl shadow-sm border border-stone-100 overflow-hidden">
                        <button onClick={() => setExpandedFaq(expandedFaq === i ? null : i)}
                          className="w-full flex justify-between items-center p-5 text-left hover:bg-stone-50 transition-colors">
                          <span className="font-medium text-stone-800 md:text-lg">{faq.q}</span>
                          {expandedFaq === i ? <ChevronUp className="w-5 h-5 text-stone-400" /> : <ChevronDown className="w-5 h-5 text-stone-400" />}
                        </button>
                        {expandedFaq === i && <div className="px-5 pb-5 pt-0 text-stone-600 leading-relaxed bg-stone-50/50"><div className="h-px bg-stone-100 mb-4"></div>{faq.a}</div>}
                      </div>
                    ))}
                  </div>
                );
              default: return null;
            }
          };

          return (
            <div className="min-h-screen bg-stone-200 flex items-start justify-center p-0 md:p-4 lg:p-8 font-sans">
              <div className="w-full max-w-md md:max-w-4xl lg:max-w-6xl bg-[#FAF8F3] md:rounded-[2.5rem] shadow-2xl overflow-hidden relative min-h-screen md:min-h-0 flex flex-col">
                
                <header className="bg-[#FAF8F3] pt-10 pb-6 px-6 md:px-12 sticky top-0 z-20 border-b border-stone-100/50">
                  <div className="flex justify-between items-end mb-6">
                     <div className="flex flex-col">
                        <h1 className="text-2xl md:text-3xl font-serif text-stone-800 tracking-wide font-bold">塔莎健康室</h1>
                        <span className="text-xs md:text-sm text-[#8A9A5B] tracking-[0.2em] uppercase font-medium">Tasha's Wellness</span>
                     </div>
                     <button className="text-stone-400 hover:text-stone-600 mb-1" title="分享"><Share2 className="w-6 h-6" /></button>
                  </div>
                  
                  <nav className="flex bg-stone-200/50 p-1 rounded-2xl overflow-x-auto hide-scrollbar">
                    {['home', 'services', 'booking', 'faq'].map((tab) => (
                      <button key={tab} onClick={() => setActiveTab(tab)}
                        className={`flex-1 min-w-[80px] md:min-w-[120px] py-3 text-sm md:text-base font-medium rounded-xl transition-all duration-300 ${
                          activeTab === tab ? 'bg-white text-[#8A9A5B] shadow-md' : 'text-stone-500 hover:text-stone-700'
                        }`}>
                        {tab === 'home' && '首頁'}
                        {tab === 'services' && '服務項目'}
                        {tab === 'booking' && '預約須知'}
                        {tab === 'faq' && '常見問題'}
                      </button>
                    ))}
                  </nav>
                </header>

                <main className="flex-1 overflow-y-auto p-5 md:p-12 pb-24 custom-scrollbar">
                  {renderContent()}
                </main>

                <div className="absolute bottom-0 w-full bg-gradient-to-t from-[#EFECE6] to-transparent h-16 pointer-events-none"></div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TashaWellnessCard />);
    </script>
</body>
</html>
